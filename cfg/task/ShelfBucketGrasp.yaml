name: ShelfBucketGrasp

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 1
  env_spacing: 8

# Robot for this scene -- default iris650_soarm100 (so_arm100 arm on a
# 650mm Iris). Swap it by editing this preset name, or via a hydra
# override: aerial_manipulators.0.preset=<other_preset>.
aerial_manipulators:
  - preset: iris650_soarm100

# The drone is welded to the world by default (this is an arm-reach task, see
# the env's module docstring). Set false to fly it instead -- that also puts
# the rotor commands back at the front of the action vector.
# examples/aerial_manipulator_control_demo.py --task ShelfBucketGrasp does exactly that.
weld_robot: true

# --- teleop tuning, read by examples/aerial_manipulator_control_demo.py ---
# Fraction of its real mass/inertia each arm link keeps under
# --arm_dynamics frozen (see aetos_multiam/utils/arm_dynamics.py). MEASURED
# optimum for this robot, and it is NOT monotonic -- 0.3 -> 2.4 deg of body
# tilt, 0.1 -> 1.3, 0.02 -> 9.9, 0.005 -> 84. Do not lower it without
# re-measuring.
arm_dynamics_residual: 0.1  # measurements + rationale: docs/ARM_DISTURBANCE.md
# Joints held at rest instead of following the leader. so_arm100's base
# rotation is the ONLY joint that yaws this drone, and it does so hard:
# sweeping it alone costs 67.8 deg of yaw and 0.64m of position error, while
# sweeping all five others together costs 2.4 deg and 0.023m. It is also
# redundant with the drone's own yaw (the keyboard arrows), so locking it
# loses no reachable workspace. The underlying cause is an Isaac/PhysX defect:
# whenever any other dynamic rigid body in the scene is moving, shoulder_pan
# stops responding to its joint drive entirely (set_joint_positions still
# moves it), so it can only be teleported, and teleporting it is what kicks
# the drone. Unlock at your own risk.
arm_locked_joints: [shoulder_pan]

time_encoding: true

success_distance: 0.05
reward_distance_scale: 1.2
reward_success_weight: 10.0
